[meta]
required_version = "=0.28.0"

# spec-spine governing the tenant-tail repository (dogfood).
#
# tenant-tail vends a verify-only toolkit; its own specs/ corpus is governed by
# the published spec-spine CLI, pinned by [meta] required_version and invoked as
# `.bin/spec-spine {compile,lint,index check,couple}`. This is the
# same dogfooding pattern spec-spine and OAP both follow. spec-spine reads its
# config from `spec-spine.toml` at the repo root; only the metadata namespace
# and layout differ from the built-in defaults.

[manifest]
# tenant-tail crates carry `[package.metadata.tenant-tail].spec = "NNN-slug"`.
metadata_namespace = "tenant-tail"

[domains]
allowed = []        # disabled: tenant-tail specs do not declare a `domain`

[kind]
allowed = []        # disabled: `kind` is free-text (symmetric with [domains])

[layout]
specs_dir     = "specs"
derived_dir   = ".derived"
standards_dir = "standards/spec"
schemas_dir   = "standards/schemas"
cargo_workspace = "Cargo.toml"
# No npm workspace in this repo; the default still probes these and finds none.
npm_workspaces = ["package.json", "pnpm-workspace.yaml"]
standalone_rust_workspaces = []
# The npm binary-distribution shim is a tracked npm package outside any npm
# workspace (this repo has none), declared as a standalone package.
standalone_npm_packages    = ["npm"]

[index]
extra_hashed_inputs = ["AGENTS.md", "Makefile", "scripts/statecraft/**/*", ".statecraft/AGENTS.md", ".statecraft/environment.json", ".statecraft/setup/github-actions-rust.json", ".github/CODEOWNERS", "standards/**/*", ".github/workflows/**/*"]
resolver_exclusions = ["target", "node_modules", ".derived", "dist", "build", ".next"]

[branding]
# The governing binary is the published spec-spine CLI.
compiler_id = "spec-spine"
indexer_id  = "spec-spine"

[coupling]
bypass_prefixes = ["**/README.md"]
waiver_keyword = "Spec-Drift-Waiver:"

[provenance.uri_schemes]
knowledge        = "knowledge://"
code-fingerprint = "fingerprint://"

[frontmatter]
extra_known_keys = []

[lint]
# Legacy whole-file source claims preserve their established ownership model.
# They are deliberately unwitnessed rather than making every code edit a global hash.
unwitnessed_allowed = [
  "Cargo.toml",
  "crates/tenant-tail-cli/src/main.rs",
  "crates/tenant-tail-core/src/certificate.rs",
  "crates/tenant-tail-core/src/data/agentic-sdk-watchlist.json",
  "crates/tenant-tail-core/src/data/core-allowlist.txt",
  "crates/tenant-tail-core/src/inter_stage_manifest.rs",
  "crates/tenant-tail-core/src/lib.rs",
  "crates/tenant-tail-core/src/platform_jws.rs",
  "crates/tenant-tail-core/tests/certificate_parity.rs",
  "crates/tenant-tail-core/tests/provenance_parity.rs",
  "crates/tenant-tail-types/src/budget.rs",
  "crates/tenant-tail-types/src/knowledge.rs",
  "crates/tenant-tail-types/src/lib.rs",
  "crates/tenant-tail-types/src/provenance.rs",
  "npm/bin/tenant-tail.js",
  "npm/lib/platform.js",
  "npm/scripts/generate-platform-packages.js",
  "npm/scripts/smoke-test.sh",
  "npm/test/platform.test.js",
  "py/scripts/generate_wheels.py",
]
